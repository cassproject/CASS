name: Image Vulnerability Scan

on:
  pull_request:
    branches: [ "1.5","1.6","1.7" ]

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job per image, so the builds (each runs the server tests against its own Elasticsearch)
  # and the Docker Scout scans run in parallel.
  scan-images:
    name: scan-images (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        image: [ cass, cass-alpine, cass-distroless, cass-standalone ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build image
        run: docker compose -f docker-compose-test.yml up -d elasticsearch-cass && docker buildx bake -f docker-compose-test.yml --allow=network.host --load ${{ matrix.image }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout CVE Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: cass-${{ matrix.image }}
          only-severities: critical,high
          write-comment: true
